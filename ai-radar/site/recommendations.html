<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPERATIONS // FRAMEWORK-FIT — AI Radar</title>
<meta name="description" content="Registro de operaciones: simulaciones del recomendador framework-fit sobre 28 frameworks.">
<style>
  :root{--void:#08080a;--panel:#101014;--panel2:#16161c;--line:#26262e;--ash:#cfc9bd;
    --dim:#76736a;--faint:#4a4842;--hazard:#e8b21f;--danger:#d23b1e;--cyan:#45c0cf;--ok:#8fb04a;
    --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--void);color:var(--ash);font-family:var(--mono);font-size:15px;
    line-height:1.6;overflow-x:hidden}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0,rgba(0,0,0,.16) 1px,transparent 1px,transparent 3px);
    mix-blend-mode:multiply;animation:flick 6s steps(60) infinite}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:9998;
    background:radial-gradient(120% 90% at 50% 0%,transparent 55%,rgba(0,0,0,.55) 100%)}
  @keyframes flick{0%,97%{opacity:1}98%{opacity:.82}99%{opacity:.94}100%{opacity:1}}
  @media (prefers-reduced-motion:reduce){body::after{animation:none}.glitch::before,.glitch::after{display:none}}
  a{color:var(--cyan);text-decoration:none}a:hover{color:var(--hazard);text-decoration:underline}
  a:focus-visible{outline:2px solid var(--hazard);outline-offset:2px}
  .wrap{max-width:980px;margin:0 auto;padding:0 22px}
  .hazard-bar{height:14px;background:repeating-linear-gradient(45deg,var(--hazard) 0 16px,#000 16px 32px);opacity:.85}
  header{border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(232,178,31,.05),transparent 70%),var(--void)}
  .tag-class{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:11px;
    letter-spacing:.22em;color:var(--danger);text-transform:uppercase;padding:14px 0 10px;border-bottom:1px dashed var(--line)}
  .blink{animation:blink 1.4s steps(2) infinite}@keyframes blink{50%{opacity:.25}}
  h1.glitch{font-size:clamp(38px,10vw,86px);line-height:.92;margin:28px 0 6px;font-weight:800;
    letter-spacing:-.02em;position:relative;text-transform:uppercase}
  .glitch::before,.glitch::after{content:attr(data-t);position:absolute;left:0;top:0;width:100%;overflow:hidden}
  .glitch::before{color:var(--danger);transform:translate(-2px,0);clip-path:inset(0 0 62% 0);animation:gl1 3.2s infinite linear alternate}
  .glitch::after{color:var(--cyan);transform:translate(2px,0);clip-path:inset(58% 0 0 0);animation:gl2 2.7s infinite linear alternate}
  @keyframes gl1{0%,92%{transform:translate(-2px,0)}93%{transform:translate(-6px,1px)}100%{transform:translate(-2px,0)}}
  @keyframes gl2{0%,90%{transform:translate(2px,0)}91%{transform:translate(7px,-1px)}100%{transform:translate(2px,0)}}
  .sub{color:var(--dim);max-width:70ch;margin:14px 0 24px}
  section{padding:40px 0;border-bottom:1px solid var(--line)}
  .eyebrow{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--danger);
    display:flex;align-items:center;gap:12px;margin:0 0 8px}
  .eyebrow::before{content:"";width:34px;height:2px;background:var(--danger)}
  .case{background:var(--panel);border:1px solid var(--line);margin:18px 0;padding:0}
  .case .top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
    padding:13px 18px;border-bottom:1px solid var(--line);background:var(--panel2)}
  .case .cid{font-size:12px;color:var(--faint);letter-spacing:.16em}
  .case h3{margin:0;font-size:19px;color:var(--ash)}
  .orc{font-size:10px;letter-spacing:.12em;padding:3px 8px;border:1px solid;text-transform:uppercase;font-weight:700}
  .orc.presente{color:var(--ok);border-color:rgba(143,176,74,.5)}
  .orc.ausente{color:var(--danger);border-color:var(--danger)}
  .orc.na{color:var(--faint);border-color:var(--line)}
  .case .body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
  .story{border-left:3px solid var(--hazard);padding:6px 0 6px 14px;color:var(--ash);font-style:italic}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{font-size:11px;border:1px solid var(--line);padding:4px 9px;color:var(--dim);background:var(--panel2)}
  .tbl-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--faint);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
  td .fw{color:var(--ash);font-weight:700}
  .fit{font-size:11px;padding:2px 7px;border:1px solid var(--line);white-space:nowrap}
  .fit.alto{color:var(--ok);border-color:rgba(143,176,74,.4)}
  .fit.medio,.fit.medioalto{color:var(--hazard);border-color:rgba(232,178,31,.4)}
  .fit.bajo,.fit.bajomedio{color:var(--dim)}
  .conf{font-size:11px;color:var(--faint)}
  .rec{background:var(--panel2);border-left:3px solid var(--ok);padding:11px 14px}
  .rec .k{display:block;color:var(--ok);font-size:10px;letter-spacing:.14em;margin-bottom:4px}
  .cav{background:var(--panel2);border-left:3px solid var(--danger);padding:11px 14px;color:var(--dim);font-size:13.5px}
  .cav .k{display:block;color:var(--danger);font-size:10px;letter-spacing:.14em;margin-bottom:4px}
  .lessons{list-style:none;padding:0;margin:8px 0 0;counter-reset:l}
  .lessons li{counter-increment:l;padding:11px 0 11px 40px;border-top:1px solid var(--line);position:relative;color:var(--dim)}
  .lessons li::before{content:"0" counter(l);position:absolute;left:0;top:11px;color:var(--hazard);font-weight:800}
  footer{padding:34px 0 64px}.stamp{font-size:11px;color:var(--faint);letter-spacing:.16em}
  .meta-row{display:flex;flex-wrap:wrap;gap:6px 24px;font-size:12px;color:var(--dim);padding:0 0 22px}
  .meta-row b{color:var(--ash)}
</style>
</head>
<body>
<div class="hazard-bar"></div>
<header><div class="wrap">
  <div class="tag-class"><span>▮ CLASSIFIED // FRAMEWORK-FIT OPERATIONS LOG</span><span class="blink">● REC · R4</span></div>
  <h1 class="glitch" data-t="OPERATIONS">OPERATIONS</h1>

<main>

<script>
(function(){
  var D=JSON.parse(document.getElementById('data').textContent);
  var $=function(i){return document.getElementById(i)};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})};
  var cls=function(s){return String(s||'').toLowerCase().replace(/[^a-z]/g,'')};
  $('note').textContent=D.note;
  $('meta').innerHTML='<span><b>'+D.cases.length+'</b> CASOS</span><span>BARRIDO: <b>'+esc(D.generated)+'</b></span><span>MOTOR: <b>framework-fit (R4)</b></span>';
  $('cases').innerHTML=D.cases.map(function(c){
    var rows=c.candidates.map(function(x){
      return '<tr><td class="fw">'+esc(x.framework)+'</td>'+
        '<td><span class="fit '+cls(x.fit)+'">'+esc(x.fit)+'</span></td>'+
        '<td>'+esc(x.why)+'</td><td class="conf">'+esc(x.confidence)+'</td></tr>';
    }).join('');
    return '<article class="case"><div class="top">'+
      '<div><span class="cid">'+esc(c.id)+'</span> &nbsp; <h3 style="display:inline">'+esc(c.title)+'</h3></div>'+
      '<span class="orc '+cls(c.oracle)+'">ORÁCULO: '+esc(c.oracle)+'</span></div>'+
      '<div class="body">'+
      '<div class="story">'+esc(c.story)+'</div>'+
      '<div class="chips">'+c.requirements.map(function(r){return '<span class="chip">'+esc(r)+'</span>'}).join('')+'</div>'+

      '<div class="cav"><span class="k">⚠ CAVEAT</span>'+esc(c.caveat)+'</div>'+
      '</div></article>';
  }).join('');

</script>
