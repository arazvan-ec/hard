id: beads
name: Beads (bd)
url: https://github.com/steveyegge/beads
family: context-eng
signal_types: [tool-release, new-technique]
one_liner: >
  Issue-tracker en forma de grafo de dependencias para agentes de codificación,
  que les da memoria estructurada y persistente para tareas de horizonte largo
  (resuelve el problema de las "50 First Dates"). Desde v1.0 el backend es una BD
  SQL versionada (Dolt) con merge a nivel de celda; el JSONL queda como export
  para colaborar vía git.

use_cases: [long-horizon-memory, multi-agent-orchestration, context-management]
languages: [any]
best_for: >
  Dar a un agente memoria de plan y dependencias que viaja con el código y se
  versiona; drop-in apuntando AGENTS.md/CLAUDE.md a bd. Mejora la planificación a
  largo plazo y el descubrimiento de trabajo.
not_for: >
  Proyectos cortos de una sola sesión donde no hace falta persistencia entre
  ejecuciones; no es un framework de proceso ni un orquestador completo.
requires: Instalar la herramienta bd; una línea en AGENTS.md/CLAUDE.md.

scores: { RIG: 3, LIG: 4, CTX: 5, MAD: 4, MA: 4, POR: 5, FIT: 5, sigma: 30 }

maturity:
  stars: 17100        # fuentes dan 17.1–17.7k a jun-2026
  last_release: "v1.0.2 (28-may-2026)"
  active: true
  license: open-source
  status: active

steal: >
  Persistir plan/dependencias como grafo versionado (no markdown plano): la
  memoria del agente se versiona y viaja con el repo, con merge a nivel de celda
  para multi-agente. Candidato directo para el backend de dedupe del propio AI
  Radar (roadmap v0.3) — reevaluar a la luz del cambio JSONL→Dolt.

sources:
