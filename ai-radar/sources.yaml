# sources.yaml — Registro de fuentes del AI Radar
#
# El activo que escala. Cada entrada es una fuente que radar-scan recorre y que
# source-curation enriquece. Tier: 1 = señal primaria/originadores, 2 = metodología/
# síntesis de alta calidad, 3 = agregador/roundup (útil para descubrir, ruidoso).
#
# Campos:
#   id          identificador único (slug)
#   name        nombre legible
#   type        awesome-list | curator-blog | curator-x | eng-blog | aggregator
#   url         URL canónica (o handle para X)
#   topics      etiquetas de taxonomía que suele cubrir
#   tier        1 | 2 | 3
#   lang        idioma principal
#   cadence     con qué frecuencia conviene revisar
#   last_checked  YYYY-MM-DD (lo actualiza radar-scan)
#   notes       qué la hace valiosa

version: 0
seeded: 2026-06-24

